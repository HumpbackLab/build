[source]
dev_num=2

[sensor]
name=OV_OV9281_MIPI_800P_60FPS_10BIT
bus_id=2
# The sample parser uses atoi(), so the 7-bit 0x60 address is written as decimal 96.
sns_i2c_addr=96
mipi_dev=0
# U4: MDN0/MDP0, MDN1/MDP1, then MCN/MCP (MIPIRX1, 2, 0).
lane_id=1,2,0,-1,-1
pn_swap=0,0,0,0,0
hw_sync=1

[sensor2]
name=OV_OV9281_MIPI_800P_60FPS_10BIT
bus_id=2
# The 7-bit 0x70 address is decimal 112 for atoi().
sns_i2c_addr=112
mipi_dev=1
# U12: MDN0_R/MDP0_R, then MCN_R/MCP_R (MIPIRX4, 3).
lane_id=4,3,-1,-1,-1
pn_swap=0,0,0,0,0
hw_sync=1
