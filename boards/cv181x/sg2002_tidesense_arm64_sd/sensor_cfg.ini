[source]
dev_num=2

[sensor]
name=OV_OV9281_MIPI_800P_60FPS_10BIT
bus_id=2
# Left U4: 7-bit 0x10, decimal for the sample parser (atoi).
sns_i2c_addr=16
mipi_dev=0
# CVITEK order: CLK, D0, D1, D2, D3. Left uses two data lanes.
lane_id=0,1,2,-1,-1
pn_swap=0,0,0,0,0
hw_sync=1

[sensor2]
name=OV_OV9281_MIPI_800P_60FPS_10BIT
bus_id=2
# Right U12: 7-bit 0x60, decimal for atoi().
sns_i2c_addr=96
mipi_dev=1
# Right uses CLK=MIPIRX3 and D0=MIPIRX4; D1 is not connected.
lane_id=3,4,-1,-1,-1
pn_swap=0,0,0,0,0
hw_sync=1
